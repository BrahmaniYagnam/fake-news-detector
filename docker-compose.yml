version: '3.9'
services:
  api:
    build: .
    ports:
      - '8000:8000'
    environment:
      - APP_NAME=Fake News Detector
      - APP_VERSION=1.0.0
      - MODEL_DIR=saved_model
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
